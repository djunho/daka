apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy

    uid: daka-prometheus

    url: http://prometheus:9090
    isDefault: true

    basicAuth: true
    basicAuthUser: $PROM_USER
    secureJsonData:
      basicAuthPassword: $PROM_PASSWORD

    jsonData:
      httpMethod: POST
      timeInterval: "15s"

    editable: false
