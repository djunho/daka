map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/daka.crt;
    ssl_certificate_key /etc/nginx/certs/daka.key;

    # ---- WebSocket negotiations ----------------------------------------
    location /api/ws/ {
        # The trailing slashes replace /api/ws/ with /ws/:
        # /api/ws/negotiations/123 -> /ws/negotiations/123
        proxy_pass http://backend:8000/ws/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Explicitly preserve authentication and origin information.
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    # ---- health endpoint ------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- application ----------------------------------------------------
    location /api/ {
        # Uploads are capped at 2 MB by the backend (settings.max_image_bytes).
        # nginx allows a little more for the multipart wrapping around the
        # file, so the backend's check -- with its clear message -- is the one
        # users see. nginx's own default is only 1 MB.
        client_max_body_size 3m;
        proxy_pass http://backend:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- uploaded images ------------------------------------------------
    # Files the backend wrote into the shared "media" volume. nginx serves
    # them straight from disk, without going through Python.
    location /media/ {
        alias /data/media/;
        # Browsers must use the Content-Type nginx sends (image/webp) and
        # never guess ("sniff") another one from the file's contents.
        add_header X-Content-Type-Options nosniff always;
        # File names are random and never reused, so a file never changes
        # and browsers may cache it for a long time (30 days).
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ---- Grafana --------------------------------------------------------
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- Prometheus -----------------------------------------------------
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Alertmanager ---------------------------------------------------
    location /alertmanager/ {
        proxy_pass http://alertmanager:9093/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- frontend (catch-all, MUST be last) -----------------------------
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
