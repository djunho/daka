global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']

  group_wait: 30s

  group_interval: 5m

  repeat_interval: 3h

  receiver: default

  routes:
    - matchers:
        - severity = "critical"
      receiver: critical
      repeat_interval: 1h

receivers:
  - name: default
  - name: critical

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['instance']
